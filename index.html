<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<title>Chauffage Urbain — Connaissances & Outils terrain</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <img src="icons/icon-192.png" alt="" class="brand-icon">
    <div>
      <h1>Chauffage Urbain</h1>
      <span class="subtitle">Connaissances & outils terrain</span>
    </div>
  </div>
  <div class="topbar-right">
    <div id="net-status" class="net-status" title="État de la connexion">…</div>
    <button id="btn-theme" class="icon-btn" type="button" title="Mode sombre / clair">🌙</button>
  </div>
</header>

<main id="view" aria-live="polite"><!-- rendu par app.js --></main>

<nav id="tabbar"><!-- rendu dynamique par app.js : les 4 onglets sur l'accueil, sinon seulement Accueil --></nav>

<div id="toast" class="toast hidden"></div>

<div id="lock-screen" class="lock-screen hidden">
  <div class="lock-box">
    <img src="icons/icon-192.png" alt="" class="lock-icon">
    <h2>Chauffage Urbain</h2>
    <p class="muted small">Application verrouillée — entre le code PIN.</p>
    <input id="lock-pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="••••" maxlength="8">
    <button id="lock-ok" class="btn big" type="button">Déverrouiller</button>
    <p id="lock-error" class="lock-error hidden">Code incorrect.</p>
  </div>
</div>

<script src="lib/qrcode.min.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW:', err));
  });
}
</script>
</body>
</html>
