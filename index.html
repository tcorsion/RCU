<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<title>Chauffage Urbain — Connaissances & Outils terrain</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <img src="icons/icon-192.png" alt="" class="brand-icon">
    <div>
      <h1>Chauffage Urbain</h1>
      <span class="subtitle">Connaissances & outils terrain</span>
    </div>
  </div>
  <div id="net-status" class="net-status" title="État de la connexion">…</div>
</header>

<main id="view" aria-live="polite"><!-- rendu par app.js --></main>

<nav id="tabbar"><!-- rendu dynamique par app.js : les 4 onglets sur l'accueil, sinon seulement Accueil --></nav>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW:', err));
  });
}
</script>
</body>
</html>
